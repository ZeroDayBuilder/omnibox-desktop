[package]
name = "omnibox-desktop"
version = "0.1.1"
description = "Cross-platform desktop virtualization manager built on QEMU"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "io-util", "time", "sync", "fs", "macros"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
