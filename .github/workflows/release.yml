name: Release

# Tag a commit (git tag v0.1.0 && git push --tags) to build installers for every platform
# and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest,   args: "--target aarch64-apple-darwin", label: "macOS (Apple Silicon)" }
          - { platform: macos-13,       args: "--target x86_64-apple-darwin",  label: "macOS (Intel)" }
          - { platform: ubuntu-22.04,   args: "",                              label: "Linux" }
          - { platform: windows-latest, args: "",                              label: "Windows" }
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }

      - run: npm install
      - run: npm run icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing/notarisation secrets (see README):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OmniBox Desktop ${{ github.ref_name }}"
          releaseBody: "Installers for macOS (.dmg), Windows (.exe / .msi) and Linux (.AppImage / .deb / .rpm). QEMU must be installed separately; see the README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
